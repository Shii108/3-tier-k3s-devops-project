<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tasks</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      background: #0e0e0e;
      color: #e0e0e0;
      line-height: 1.5;
    }

    .page {
      max-width: 680px;
      margin: 0 auto;
      padding: 56px 24px 100px;
    }

    /* header */
    h1 {
      font-size: 2.2rem;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.02em;
      margin-bottom: 6px;
    }

    .tagline {
      font-size: 1.05rem;
      color: #666;
      margin-bottom: 40px;
    }

    /* stats */
    .stats {
      display: flex;
      gap: 1px;
      background: #222;
      border-radius: 14px;
      overflow: hidden;
      margin-bottom: 24px;
    }

    .stat {
      flex: 1;
      padding: 20px 22px;
      background: #161616;
    }

    .stat-label {
      font-size: 0.85rem;
      color: #555;
      margin-bottom: 6px;
    }

    .stat-num {
      font-size: 2rem;
      font-weight: 700;
      line-height: 1;
    }

    .stat-num.pend { color: #e8a44a; }
    .stat-num.done { color: #5cbf78; }

    /* progress */
    .progress-row {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 32px;
    }

    .progress-track {
      flex: 1;
      height: 6px;
      background: #1a1a1a;
      border-radius: 3px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #e8a44a, #5cbf78);
      border-radius: 3px;
      transition: width 0.4s ease;
    }

    .progress-pct {
      font-size: 0.95rem;
      color: #555;
      min-width: 36px;
      text-align: right;
    }

    /* input */
    .add-row {
      display: flex;
      gap: 10px;
      margin-bottom: 10px;
    }

    .add-row input {
      flex: 1;
      height: 52px;
      padding: 0 18px;
      font: inherit;
      font-size: 1.05rem;
      color: #e0e0e0;
      background: #161616;
      border: 2px solid #252525;
      border-radius: 12px;
      outline: none;
      transition: border-color 0.15s;
    }

    .add-row input::placeholder { color: #444; }
    .add-row input:focus { border-color: #e8a44a; }

    .add-row button {
      height: 52px;
      padding: 0 26px;
      font: inherit;
      font-size: 1.05rem;
      font-weight: 600;
      color: #111;
      background: #e8a44a;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }

    .add-row button:hover { background: #f0b460; }
    .add-row button:active { transform: scale(0.97); }
    .add-row button:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

    /* status */
    .status {
      font-size: 0.92rem;
      padding: 11px 16px;
      border-radius: 10px;
      margin-bottom: 28px;
      background: rgba(92, 191, 120, 0.08);
      color: #5cbf78;
    }

    .status:empty { display: none; }
    .status.error { background: rgba(230, 80, 80, 0.08); color: #e65050; }
    .status.loading { background: rgba(232, 164, 74, 0.08); color: #e8a44a; }

    /* divider label */
    .list-label {
      font-size: 0.82rem;
      font-weight: 600;
      color: #444;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 14px;
    }

    /* task list */
    .tasks {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .task {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 16px 18px;
      background: #161616;
      border: 1px solid #222;
      border-radius: 12px;
      transition: border-color 0.15s, transform 0.15s;
    }

    .task:hover {
      border-color: #333;
      transform: translateY(-1px);
    }

    .task.done { opacity: 0.45; }
    .task.done:hover { opacity: 0.6; }

    /* checkbox */
    .task input[type="checkbox"] {
      appearance: none;
      -webkit-appearance: none;
      width: 22px;
      height: 22px;
      border: 2px solid #333;
      border-radius: 6px;
      background: transparent;
      cursor: pointer;
      flex-shrink: 0;
      position: relative;
      transition: all 0.12s;
    }

    .task input[type="checkbox"]:hover { border-color: #e8a44a; }

    .task input[type="checkbox"]:checked {
      background: #5cbf78;
      border-color: #5cbf78;
    }

    .task input[type="checkbox"]:checked::after {
      content: '';
      position: absolute;
      left: 6px;
      top: 2px;
      width: 6px;
      height: 11px;
      border: solid #111;
      border-width: 0 2.5px 2.5px 0;
      transform: rotate(45deg);
    }

    .task-body {
      flex: 1;
      min-width: 0;
    }

    .task-name {
      font-size: 1.08rem;
      font-weight: 500;
      word-break: break-word;
    }

    .task-name.crossed {
      text-decoration: line-through;
      color: #555;
    }

    .task-date {
      font-size: 0.8rem;
      color: #444;
      margin-top: 3px;
      display: flex;
      align-items: center;
      gap: 0;
    }

    .task-status {
      font-weight: 600;
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .task-status-pending { color: #e8a44a; }
    .task-status-done { color: #5cbf78; }

    .task .del {
      font: inherit;
      font-size: 0.82rem;
      font-weight: 500;
      color: #e65050;
      background: rgba(230, 80, 80, 0.08);
      border: none;
      border-radius: 8px;
      padding: 7px 14px;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.15s, background 0.15s;
      flex-shrink: 0;
    }

    .task:hover .del { opacity: 1; }
    .task .del:hover { background: rgba(230, 80, 80, 0.16); }

    /* empty */
    .empty {
      text-align: center;
      padding: 52px 20px;
      color: #444;
      border: 2px dashed #222;
      border-radius: 14px;
    }

    .empty-title {
      font-size: 1.15rem;
      font-weight: 600;
      color: #666;
      margin-bottom: 6px;
    }

    .empty-sub {
      font-size: 0.95rem;
    }

    /* mobile */
    @media (max-width: 520px) {
      .page { padding: 36px 16px 60px; }
      h1 { font-size: 1.7rem; }
      .stats { flex-direction: column; }
      .add-row { flex-direction: column; }
      .add-row button { width: 100%; }
      .task .del { opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="page">
    <h1>Tasks</h1>
    <p class="tagline">Track what needs to get done</p>

    <div class="stats">
      <div class="stat">
        <div class="stat-label">Total</div>
        <div class="stat-num" id="totalCount">0</div>
      </div>
      <div class="stat">
        <div class="stat-label">Pending</div>
        <div class="stat-num pend" id="pendingCount">0</div>
      </div>
      <div class="stat">
        <div class="stat-label">Done</div>
        <div class="stat-num done" id="doneCount">0</div>
      </div>
    </div>

    <div class="progress-row">
      <div class="progress-track">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <span class="progress-pct" id="completionRate">0%</span>
    </div>

    <div class="add-row">
      <input type="text" id="taskInput" placeholder="What needs to be done?" autocomplete="off" spellcheck="false" />
      <button id="addButton" type="button">Add task</button>
    </div>

    <p id="statusMessage" class="status"></p>

    <div class="list-label">Your tasks</div>
    <div id="taskList" class="tasks"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
